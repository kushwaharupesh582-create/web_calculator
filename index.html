<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Calculator</title>
  <link rel="stylesheet" href="cal_style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Animated Ambient Aura Background -->
  <div class="aura-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Interactive Outside Cursor Glow Light -->
  <div class="cursor-glow" id="cursor-glow"></div>

  <!-- Top Bar with Live Clock -->
  <header class="top-bar">
    <div class="brand">CALCULATOR</div>
    <div id="live-clock" class="clock-display">00:00:00 AM</div>
  </header>

  <!-- Main Calculator Wrapper -->
  <main class="calc-wrapper">
    <div class="calculator-card" id="calculator">

      <!-- Display Screen (scrollable) -->
      <div class="display-container" id="display-container">
        <div class="history-panel" id="history-panel"></div>
        <div class="expression-line" id="expression" contenteditable="false" inputmode="none"></div>
        <div class="result-line" id="result">0</div>
      </div>

      <!-- Mode Selector -->
      <div class="mode-bar">
        <button class="mode-btn active" id="mode-basic-btn" type="button">
          <span>Basic</span>
        </button>
        <button class="mode-btn" id="mode-trig-btn" type="button">
          <span>Scientific</span>
        </button>
      </div>

      <!-- Scientific Panel -->
      <div class="keypad extended-keypad hidden" id="scientific-panel">
        <button class="btn btn-sci" data-fn="sin" type="button">sin</button>
        <button class="btn btn-sci" data-fn="cos" type="button">cos</button>
        <button class="btn btn-sci" data-fn="tan" type="button">tan</button>
        <button class="btn btn-sci" data-fn="log" type="button">log</button>
        <button class="btn btn-sci" data-fn="ln" type="button">ln</button>
        <button class="btn btn-sci" data-val="^" type="button">x^y</button>
        <button class="btn btn-sci" data-val="π" type="button">π</button>
        <button class="btn btn-sci" data-fn="sqrt" type="button">√</button>
      </div>

      <!-- Main Keypad -->
      <div class="keypad main-keypad">
        <button class="btn btn-clear-all glow-red" id="btn-ac" type="button">AC</button>
        <button class="btn btn-clear-one glow-gold" id="btn-ce" type="button">⌫</button>
        <button class="btn btn-op" data-val="%" type="button">%</button>
        <button class="btn btn-op" data-val="÷" type="button">÷</button>

        <button class="btn btn-num" data-val="7" type="button">7</button>
        <button class="btn btn-num" data-val="8" type="button">8</button>
        <button class="btn btn-num" data-val="9" type="button">9</button>
        <button class="btn btn-op" data-val="×" type="button">×</button>

        <button class="btn btn-num" data-val="4" type="button">4</button>
        <button class="btn btn-num" data-val="5" type="button">5</button>
        <button class="btn btn-num" data-val="6" type="button">6</button>
        <button class="btn btn-op" data-val="-" type="button">-</button>

        <button class="btn btn-num" data-val="1" type="button">1</button>
        <button class="btn btn-num" data-val="2" type="button">2</button>
        <button class="btn btn-num" data-val="3" type="button">3</button>
        <button class="btn btn-op" data-val="+" type="button">+</button>

        <button class="btn btn-num span-2" data-val="0" type="button">0</button>
        <button class="btn btn-num" data-val="." type="button">.</button>
        <button class="btn btn-equals glow-gold" id="btn-equals" type="button">=</button>
      </div>

    </div>
  </main>

  <script src="cal_script.js"></script>
</body>
</html>
